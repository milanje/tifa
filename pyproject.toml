[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "tifa-factor"
dynamic = ["version"]
description = "Fast factorization of integers of up to about 220 bits, with the TIFA library"
readme = "python/README.md"
license = "LGPL-2.1-or-later"
license-files = ["readme/license_v2.1.txt"]
authors = [{ name = "Jerome Milan" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/milanje/tifa"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build.targets = ["_tifa"]
install.components = ["python"]
wheel.packages = ["python/tifa"]
wheel.py-api = "cp310"
sdist.exclude = ["build*", ".github", ".claude"]

[tool.scikit-build.cmake.define]
TIFA_BUILD_PYTHON = "ON"
TIFA_BUILD_TESTS = "OFF"
TIFA_GENERATE_DOXYGEN_DOC = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(Tifa\s+VERSION\s+(?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]
