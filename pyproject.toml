[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "tifa-factor"
dynamic = ["version"]
description = "Fast factorization of integers of up to about 220 bits, with the TIFA library"
readme = "python/README.md"
license = "LGPL-2.1-or-later"
license-files = ["readme/license_v2.1.txt", "readme/license_v3.txt"]
authors = [{ name = "Jerome Milan" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/milanje/tifa"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build.targets = ["_tifa"]
install.components = ["python"]
wheel.packages = ["python/tifa"]
wheel.py-api = "cp310"
sdist.exclude = ["build*", ".github", ".claude"]

[tool.scikit-build.cmake.define]
TIFA_BUILD_PYTHON = "ON"
TIFA_BUILD_TESTS = "OFF"
TIFA_GENERATE_DOXYGEN_DOC = "OFF"
# No compiled-in tuning directory: the default would be the build's temporary
# directory, which another user could create where the wheel is installed.
TIFA_TUNING_DIR = ""

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(Tifa\s+VERSION\s+(?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

# Wheels for PyPI (.github/workflows/wheels.yml): one abi3 wheel per platform,
# built with Python 3.10 and tested with 3.10 and 3.15, with GMP built by
# python/build_gmp.sh and linked statically (found through GMP_ROOT).
[tool.cibuildwheel]
build = "cp310-* cp315-*"
archs = ["auto64"]
before-all = "bash {project}/python/build_gmp.sh"
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests"
build-verbosity = 1

[tool.cibuildwheel.linux]
environment = { GMP_ROOT = "/opt/gmp" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { GMP_ROOT = "$HOME/gmp", MACOSX_DEPLOYMENT_TARGET = "11.0" }
